<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apex FIT | Pagamento</title>
    <link rel="stylesheet" href="../style_planos_index.css" />
  </head>
  <body class="page-premium">
    <header>
      <a href="index.html" class="logo">APEX <span>FIT</span></a>

      <nav>
        <a href="index.html">Início</a>
        <a href="index.html#planos">Planos</a>
        <a href="#cadastro">Cadastro</a>
      </nav>
    </header>

    <section class="plan-page premium-page">
      <div class="plan-info">
        <span class="tag">EXPERIÊNCIA EXCLUSIVA</span>

        <h1 id="nome-plano"></h1>

        <p class="big-price" id="valor-plano"></p>

        <p>
          Para quem busca o máximo desempenho, atendimento personalizado e uma
          experiência completa.
        </p>
      </div>

      <div class="form-container" id="cadastro">
        <h2>Faça seu cadastro</h2>

        <p>Preencha seus dados de pagamento</p>

        <form>
          <label for="cartao">Número do cartão</label>
          <input
            type="text"
            id="cartao"
            name="cartao"
            placeholder="0000 0000 0000 0000"
            required
          />

          <label for="nomeCartao">Nome no cartão</label>
          <input
            type="text"
            id="nomeCartao"
            name="nomeCartao"
            placeholder="Nome completo"
            required
          />

          <label for="validade">Data de validade</label>
          <input
            type="text"
            id="validade"
            name="validade"
            placeholder="MM/AA"
            required
          />

          <label for="cvv">CVV</label>
          <input
            type="text"
            id="cvv"
            name="cvv"
            placeholder="000"
            maxlength="3"
            required
          />

          <button
            type="submit"
            class="btn form-btn"
            onclick="finalizarPagamento()"
          >
            Finalizar Pagamento
          </button>
        </form>
      </div>
    </section>

    <footer>
      <p>© 2026 Apex Fit - Todos os direitos reservados</p>
    </footer>
    <script src="../script.js"></script>
  </body>
</html>
