
<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apex FIT | Cadastro e Pagamento</title>
    <link rel="stylesheet" href="../style_planos_index.css" />
  </head>

  <body class="page-premium">
    <header>
      <a href="index.html" class="logo">APEX <span>FIT</span></a>

      <nav>
        <a href="index.html">Início</a>
        <a href="index.html#planos">Planos</a>
        <a href="#cadastro">Cadastro</a>
      </nav>
    </header>

    <section class="plan-page premium-page">
      <div class="plan-info">
        <span class="tag">EXPERIÊNCIA EXCLUSIVA</span>
        <h1 id="nome-plano"></h1>
        <p class="big-price" id="valor-plano"></p>

        <p>
          Para quem busca o máximo desempenho, atendimento
          personalizado e uma experiência completa.
        </p>
      </div>

      <div class="form-container" id="cadastro">
        <h2>Cadastro do cliente</h2>
        <p>Preencha seus dados para se cadastrar na Apex FIT.</p>

        <form id="formCadastro">
          <label for="nome-cliente">Nome completo</label>
          <input
            type="text"
            id="nome-cliente"
            required
            placeholder="Seu nome completo"
          />

          <label for="email-cliente">E-mail</label>
          <input
            type="email"
            id="email-cliente"
            required
            placeholder="seuemail@email.com"
          />

          <label for="telefone-cliente">Telefone</label>
          <input
            type="tel"
            id="telefone-cliente"
            required
            placeholder="(41) 99999-9999"
          />

          <h2>Dados de pagamento</h2>

          <label for="cartao">Número do cartão</label>
          <input
            type="text"
            id="cartao"
            inputmode="numeric"
            autocomplete="cc-number"
            placeholder="0000 0000 0000 0000"
            maxlength="19"
            required
          />

          <label for="nomeCartao">Nome no cartão</label>
          <input
            type="text"
            id="nomeCartao"
            autocomplete="cc-name"
            placeholder="Nome impresso no cartão"
            required
          />

          <label for="validade">Data de validade</label>
          <input
            type="text"
            id="validade"
            autocomplete="cc-exp"
            placeholder="MM/AA"
            maxlength="5"
            required
          />

          <label for="cvv">CVV</label>
          <input
            type="password"
            id="cvv"
            inputmode="numeric"
            autocomplete="cc-csc"
            placeholder="CVV"
            maxlength="4"
            required
          />

          <button type="submit" class="btn form-btn">
            Cadastrar cliente
          </button>
        </form>
      </div>
    </section>

    <footer>
      <p>© 2026 Apex Fit - Todos os direitos reservados</p>
    </footer>

    <script src="../script.js"></script>
  </body>
</html>
